#
# Repository settings for probot/settings GitHub App.
# https://github.com/probot/settings
#
# This file defines repository-level configuration that is automatically
# applied by the probot/settings app when changes are pushed to the default
# branch. Install the app at: https://github.com/apps/settings
#
# Repository settings — configured for metadatastician/cadastra.
#
# Every value below is reconciled against the LIVE repository
# (`gh api repos/metadatastician/cadastra`, read 2026-11-08), not inherited from
# the estate template. This block previously carried a DIFFERENT repository's
# identity -- name "paint-type", that project's description and homepage, and
# that project's wiki/downloads/rebase toggles. Because probot/settings applies
# this file on every push to the default branch, a single app run against the
# copied block would have renamed this repository and flipped four settings that
# have nothing to do with it.

# ─── Repository Settings ───────────────────────────────────────────────────────

repository:
  name: "cadastra"
  description: "Scans Hyperpolymath and Metadatastician repositories, classifies their state, flags estate-policy issues, and maintains the canonical inventory and triage reports."
  homepage: "https://github.com/metadatastician/cadastra"
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# ─── Labels ────────────────────────────────────────────────────────────────────

labels:
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"

  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"

  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"

  - name: "security"
    color: "e4e669"
    description: "Security-related issue or vulnerability"

  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"

  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"

  - name: "question"
    color: "d876e3"
    description: "Further information is requested"

  - name: "duplicate"
    color: "cfd3d7"
    description: "This issue or pull request already exists"

  - name: "invalid"
    color: "e4e669"
    description: "This doesn't seem right"

  - name: "wontfix"
    color: "ffffff"
    description: "This will not be worked on"

  - name: "dependencies"
    color: "0366d6"
    description: "Pull requests that update a dependency file"

  - name: "ci/cd"
    color: "fbca04"
    description: "Continuous integration and deployment"

  - name: "rsr"
    color: "006b75"
    description: "Rhodium Standard Repository compliance"

  - name: "hypatia"
    color: "5319e7"
    description: "Hypatia neurosymbolic scanner finding"

  - name: "bot"
    color: "b4a8d1"
    description: "Automated action by gitbot-fleet"

  - name: "breaking-change"
    color: "b60205"
    description: "Introduces a breaking change"

  - name: "performance"
    color: "f9d0c4"
    description: "Performance improvement"

  - name: "refactor"
    color: "c5def5"
    description: "Code refactoring with no functional change"

  - name: "proof needed"
    color: "fbcca0"
    description: "Formal proof required for verification"

  - name: "proof complete"
    color: "006b75"
    description: "Formal proof has been completed and verified"

# ─── Branch protection ─────────────────────────────────────────────────────────
#
# DELIBERATELY ABSENT. Protection of `main` is owned by rulesets, not by this
# file:
#
#   * repository ruleset `Secret-Scan-Floor` (id 24310216, active) requires the
#     `scan / gitleaks` status check on the default branch. It is authoritative
#     for the secret-scanning gate.
#   * organisation rulesets `EstateBranching`, `Branch-Floor`,
#     `Branch-Signatures` and `App Permissions` supply the pull-request,
#     linear-history, signature and app-permission rules.
#
# The `branches:` block that used to sit here was inherited from another
# repository and required four contexts this repository does not produce:
# `Cargo check + clippy + fmt`, `Cargo test`, `analyze (javascript-typescript,
# none)` and `openssf-compliance`. Only the last is emitted here; the first
# three name a Rust/TypeScript toolchain cadastra does not have. Applied by
# probot, that block would have rebuilt `main`'s protection around checks that
# can never report, making the branch permanently unmergeable while silently
# disagreeing with the ruleset that actually gates it. Two sources of truth for
# one branch is the defect; the ruleset is the surviving one.
#
# Do not re-add a `branches:` block. Change the ruleset instead, so the
# requirement stays visible in exactly one place.
