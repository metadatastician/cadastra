# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Single secret scanner. The standards reusable runs gitleaks (working tree +
# full git history + an AsciiDoc mirror pass) and the Rust- and shell-secrets
# checks, i.e. the three contexts `scan / gitleaks`, `scan / rust-secrets` and
# `scan / shell-secrets`. An inline TruffleHog job previously lived here, but
# the reusable DELIBERATELY retired TruffleHog as redundant (gitleaks gives
# sufficient coverage at lower cost). Re-adding it was duplicated work, not
# extra coverage. See .github/workflows/README.adoc.
jobs:
  scan:
    # Least privilege, and the callee's own contract. Each of the reusable's
    # three jobs declares `permissions: contents: read`; its header states that
    # this is "the whole requirement" and that a caller granting more is
    # granting spend nothing consumes.
    #
    # The `pull-requests: write` that used to sit here was carried to satisfy an
    # earlier comment claiming the callee needed it for a PR summary comment.
    # That was true before standards#500 replaced `gitleaks/gitleaks-action`
    # with a pinned, checksum-verified binary, and false after it. It is removed
    # rather than kept "just in case": an unused write grant on every PR is
    # exactly the kind of permission creep a secret scanner should not model.
    #
    # A called workflow cannot exceed its caller's JOB-LEVEL grant, so this
    # block is the real ceiling for the three jobs below it.
    permissions:
      contents: read
    # Pin: metadatastician/standards (the repository that `hyperpolymath/standards`
    # was transferred into). Verified live before use, not assumed:
    #   * the reusable exists at this exact SHA
    #     (`.github/workflows/secret-scanner-reusable.yml`),
    #   * the SHA is a full 40-character commit id, and the caller is locked to
    #     it in .github/workflows/actions.lock,
    #   * it has been exercised at runtime here: the run for this caller created
    #     all three `scan / *` jobs (previously the old-owner pin produced zero
    #     jobs -- a startup failure with no check run at all).
    # Do not bump it to a SHA that has not been run. bd0df9ea (the pre-transfer
    # `hyperpolymath/standards` pin) is still referenced by mirror.yml, where it
    # startup-fails; it is not a candidate here.
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
